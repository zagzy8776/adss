name = "payoutpool-api"
main = "worker.js"
compatibility_date = "2026-11-01"

# Same-origin only in production. Set to "*" while testing from file:// or
# localhost, then lock it down.
[vars]
ALLOWED_ORIGIN = "*"

# Create with:  npx wrangler kv namespace create PP
# Then paste the printed id below.
[[kv_namespaces]]
binding = "PP"
